services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: data-api-clickhouse
    # Auto-restart so ClickHouse survives Docker/OrbStack restarts and host reboots
    # (otherwise the syncer/API can't connect after a reboot).
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: xrpl
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '8123:8123' # HTTP interface (used by @clickhouse/client)
      - '9000:9000' # native protocol
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: build & run the services locally. Requires NPM_TOKEN for @gatehub/toolbox.
  syncer:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/syncer/Dockerfile
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    env_file: apps/syncer/.env
    environment:
      GH_CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - '3002:3002'

  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    env_file: apps/api/.env
    environment:
      GH_CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - '3001:3001'

volumes:
  clickhouse-data:
