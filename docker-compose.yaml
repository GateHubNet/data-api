# Local development stack. One ClickHouse server, one database per network (the database is named after the network:
# `xrpl`, `xahau`), and per network a one-shot migrate job, a syncer and an api - the same images as production.
#
#   docker compose up -d clickhouse                      only ClickHouse; run the apps from source (pnpm start:syncer / start:api)
#   docker compose --profile full up -d --build          + the XRPL stack: migrate-xrpl, syncer-xrpl, api-xrpl
#   docker compose --profile xahau up -d --build         + the Xahau stack: migrate-xahau, syncer-xahau, api-xahau
#   docker compose --profile full --profile xahau up -d --build    both networks
#   docker compose run --rm migrate-xahau                apply the schema of one network on its own
#
# Building the images needs NPM_TOKEN (the private @gatehub/toolbox); it is passed as a BuildKit secret, not baked in:
#   NPM_TOKEN=... docker compose --profile full build
# The images are always built from this checkout (`pull_policy: build`; layers are cached): the image names are not looked up
# in any registry.
#
# Everything is published on 127.0.0.1 only. The stack is configured from the environment of this shell
# (GH_CLICKHOUSE_USER, GH_CLICKHOUSE_PASSWORD, GH_API_KEYS, XRPL_NODE_ENDPOINTS, ...); the defaults below are for
# development. Nothing reads apps/*/.env: those files are for running the apps from source.
#
# Migrations are owned by the migrate-* jobs (the apps wait for them to complete), so the syncers run with
# GH_RUN_MIGRATIONS_ON_BOOT=false.
#
# Next to another stack: no container has a fixed name (compose names them after the project), and every host port can be
# moved with a variable (defaults in brackets): CLICKHOUSE_HTTP_PORT (8123), CLICKHOUSE_NATIVE_PORT (9000),
# XRPL_API_PORT (3001), XRPL_API_METRICZ_PORT (3003), XRPL_SYNCER_PORT (3002), XRPL_SYNCER_METRICZ_PORT (3004),
# XAHAU_API_PORT (3011), XAHAU_API_METRICZ_PORT (3013), XAHAU_SYNCER_PORT (3012), XAHAU_SYNCER_METRICZ_PORT (3014). E.g.
#   docker compose -p my-check up -d clickhouse                                        a second stack, default ports
#   CLICKHOUSE_HTTP_PORT=18123 CLICKHOUSE_NATIVE_PORT=19000 docker compose -p my-check up -d clickhouse

x-syncer-build: &syncer-build
  context: .
  dockerfile: apps/syncer/Dockerfile
  secrets: [npm_token]

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  secrets: [npm_token]

x-clickhouse-client: &clickhouse-client
  GH_CLICKHOUSE_URL: http://clickhouse:8123
  GH_CLICKHOUSE_USER: ${GH_CLICKHOUSE_USER:-default}
  GH_CLICKHOUSE_PASSWORD: ${GH_CLICKHOUSE_PASSWORD:-}

# node:slim has no wget/curl, so the probes use Node's global fetch.
x-api-healthcheck: &api-healthcheck
  test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/liveliness/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

# The syncer opens its HTTP port only once its node connection is up, and answers 503 while it is more than
# GH_MAX_LAG_HEALTHY ledgers behind for over a minute (catching up): `unhealthy` there is informational, nothing restarts on it.
x-syncer-healthcheck: &syncer-healthcheck
  test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3002/liveliness/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 60s

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.14.3
    # Auto-restart so ClickHouse survives Docker/OrbStack restarts and host reboots
    # (otherwise the syncer/API can't connect after a reboot).
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      # No CLICKHOUSE_DB: the migrate-* jobs create the database of their network.
      CLICKHOUSE_USER: ${GH_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${GH_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123' # HTTP interface (used by @clickhouse/client)
      - '127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000' # native protocol
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- XRPL (profile: full)

  # One-shot: create the `xrpl` database and apply the schema, then exit 0.
  migrate-xrpl:
    profiles: ['full']
    build: *syncer-build
    image: gatehub/data-syncer:${IMAGE_TAG:-dev}
    pull_policy: build
    command: ['node', 'node_modules/@gatehub/data-api-shared/dist/clickhouse/migrate.js']
    environment:
      <<: *clickhouse-client
      GH_NETWORK: xrpl
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: 'no'

  syncer-xrpl:
    profiles: ['full']
    build: *syncer-build
    image: gatehub/data-syncer:${IMAGE_TAG:-dev}
    pull_policy: build
    environment:
      <<: *clickhouse-client
      GH_NETWORK: xrpl
      GH_NODE_ENDPOINTS: ${XRPL_NODE_ENDPOINTS:-wss://s2.ripple.com,wss://xrplcluster.com}
      GH_VALIDATION_ENDPOINTS: ${XRPL_VALIDATION_ENDPOINTS:-}
      GH_SYNC_START_LEDGER: ${XRPL_SYNC_START_LEDGER:-}
      GH_RUN_MIGRATIONS_ON_BOOT: 'false'
      GH_HTTP_API_PORT: 3002
      GH_METRICZ_PORT: 3000
    depends_on:
      migrate-xrpl:
        condition: service_completed_successfully
    healthcheck: *syncer-healthcheck
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:${XRPL_SYNCER_PORT:-3002}:3002' # /liveliness/healthz
      - '127.0.0.1:${XRPL_SYNCER_METRICZ_PORT:-3004}:3000' # /metricz

  api-xrpl:
    profiles: ['full']
    build: *api-build
    image: gatehub/data-api:${IMAGE_TAG:-dev}
    pull_policy: build
    environment:
      <<: *clickhouse-client
      GH_NETWORK: xrpl
      GH_NODE_ENDPOINTS: ${XRPL_NODE_ENDPOINTS:-wss://s2.ripple.com,wss://xrplcluster.com}
      # Development mode, not the image's production one: the API refuses to start in production without real keys, and the
      # key below is a development default. Set GH_API_KEYS to use your own.
      NODE_ENV: development
      GH_API_KEYS: ${GH_API_KEYS:-dev-api-key}
      GH_HTTP_API_PORT: 3001
      GH_METRICZ_PORT: 3000
    depends_on:
      migrate-xrpl:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:${XRPL_API_PORT:-3001}:3001' # /v2/*, /liveliness/healthz, /internal/docs
      - '127.0.0.1:${XRPL_API_METRICZ_PORT:-3003}:3000' # /metricz

  # ---------------------------------------------------------------- Xahau (profile: xahau)

  # One-shot: create the `xahau` database and apply the schema, then exit 0.
  migrate-xahau:
    profiles: ['xahau']
    build: *syncer-build
    image: gatehub/data-syncer:${IMAGE_TAG:-dev}
    pull_policy: build
    command: ['node', 'node_modules/@gatehub/data-api-shared/dist/clickhouse/migrate.js']
    environment:
      <<: *clickhouse-client
      GH_NETWORK: xahau
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: 'no'

  syncer-xahau:
    profiles: ['xahau']
    build: *syncer-build
    image: gatehub/data-syncer:${IMAGE_TAG:-dev}
    pull_policy: build
    environment:
      <<: *clickhouse-client
      GH_NETWORK: xahau
      GH_NODE_ENDPOINTS: ${XAHAU_NODE_ENDPOINTS:-wss://xahau.network}
      GH_VALIDATION_ENDPOINTS: ${XAHAU_VALIDATION_ENDPOINTS:-}
      GH_SYNC_START_LEDGER: ${XAHAU_SYNC_START_LEDGER:-}
      GH_RUN_MIGRATIONS_ON_BOOT: 'false'
      GH_HTTP_API_PORT: 3002
      GH_METRICZ_PORT: 3000
    depends_on:
      migrate-xahau:
        condition: service_completed_successfully
    healthcheck: *syncer-healthcheck
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:${XAHAU_SYNCER_PORT:-3012}:3002' # /liveliness/healthz
      - '127.0.0.1:${XAHAU_SYNCER_METRICZ_PORT:-3014}:3000' # /metricz

  api-xahau:
    profiles: ['xahau']
    build: *api-build
    image: gatehub/data-api:${IMAGE_TAG:-dev}
    pull_policy: build
    environment:
      <<: *clickhouse-client
      GH_NETWORK: xahau
      GH_NODE_ENDPOINTS: ${XAHAU_NODE_ENDPOINTS:-wss://xahau.network}
      NODE_ENV: development # see api-xrpl
      GH_API_KEYS: ${GH_API_KEYS:-dev-api-key}
      GH_HTTP_API_PORT: 3001
      GH_METRICZ_PORT: 3000
    depends_on:
      migrate-xahau:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:${XAHAU_API_PORT:-3011}:3001' # /v2/*, /liveliness/healthz, /internal/docs
      - '127.0.0.1:${XAHAU_API_METRICZ_PORT:-3013}:3000' # /metricz

# The npm token for the private @gatehub/toolbox, read from the NPM_TOKEN environment variable at build time only.
secrets:
  npm_token:
    environment: NPM_TOKEN

volumes:
  clickhouse-data:
