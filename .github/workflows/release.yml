# A release, on every pushed tag v* (v1.4.0, or a pre-release such as v1.4.0-rc.1):
#   1. test     the whole CI workflow (build, unit tests, the three e2e suites);
#   2. images   the API and syncer images for linux/amd64 and linux/arm64, pushed to GitHub Packages (ghcr.io) as the tag's
#               version without its v (1.4.0) and as latest;
#   3. release  the GitHub release of the tag: its body is the changelog since the previous tag (cliff.toml), which is also
#               attached as CHANGELOG.md. A tag with a "-" is marked a pre-release.
# A step that fails stops the ones after it, so a release exists only for a tag whose tests passed and whose images are out.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Image names on ghcr.io must be lower case.
  NAMESPACE: ghcr.io/gatehubnet

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  images:
    name: Image ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: data-api
            dockerfile: apps/api/Dockerfile
          - image: data-syncer
            dockerfile: apps/syncer/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.image }}
          # Every tag moves latest, a pre-release included.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # The npm token reaches the build as the BuildKit secret npm_token, as in docs/deployment.md: in no layer.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changelog since the previous tag
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" CHANGELOG.md --verify-tag --title "$TAG" --notes-file CHANGELOG.md $prerelease
