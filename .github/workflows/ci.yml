# Build and test on every pull request to master and every push to master. The release workflow runs it as its first job.
# The e2e suites start their own throwaway ClickHouse with testcontainers (the runner's Docker), one package per job.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; master and tags run to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
      - run: pnpm build
      - run: pnpm test

  e2e:
    name: e2e (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: shared
            filter: "@gatehub/data-api-shared"
          - package: api
            filter: "@gatehub/data-api-service"
          - package: syncer
            filter: "@gatehub/data-syncer"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
      # The apps' suites import the shared package from its build.
      - run: pnpm build
      - run: pnpm --filter "${{ matrix.filter }}" test:e2e

  changelog:
    name: Changelog preview
    # The release writes its own; on a tag this would only repeat it.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: CHANGELOG-unreleased.md
      - name: Show it in the job summary
        run: |
          {
            echo "What the next release's changelog holds so far:"
            echo
            cat CHANGELOG-unreleased.md
          } >> "$GITHUB_STEP_SUMMARY"
