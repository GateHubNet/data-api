worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's embedded DNS — lets nginx re-resolve the `api` service to all replicas.
  resolver 127.0.0.11 valid=10s ipv6=off;
  access_log /dev/stdout;
  error_log  /dev/stderr;

  server {
    listen 80;
    server_name _;

    # TLS terminates here in production: add `listen 443 ssl;` + certs (mount certs,
    # or run behind a cloud load balancer / cert-manager). HTTP shown for brevity.

    location / {
      set $api http://api:3001;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
