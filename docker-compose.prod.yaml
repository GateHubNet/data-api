# Production-shaped topology: one deployment per network (XRPL and Xahau) on one ClickHouse server.
#
#   ClickHouse Keeper -> ClickHouse -> migrate-<network> (one-shot, creates the database of the network and applies the schema)
#                                   -> migrate-shared (one-shot, the `shared` database every network's api reads, ADR-0014)
#                                   -> syncer-<network> (ingest, exactly one) + api-<network> (read replicas)
#                                   -> exporter-<network> (exports, exactly one; profile `exports`) -> api-<network>
#   nginx routes by host to the apis: xrpl.data.* -> api-xrpl, xahau.data.* -> api-xahau (deploy/nginx/nginx.conf.template)
#
# The two slots, xrpl and xahau, serve the network their env file names: XRPL_NETWORK is xrpl (the default) or xrpl-testnet,
# XAHAU_NETWORK is xahau (the default) or xahau-testnet. Keep each in its family: nginx routes xrpl.data.* to the xrpl slot, so
# xahau-testnet in XRPL_NETWORK would serve Xahau Testnet on the XRPL host. Every app logs `network=...` at boot (and `kind=testnet`
# on a testnet), and refuses a node of another network. The database of a slot is its network's own (xrpl, xahau, xrpl_testnet,
# xahau_testnet: GH_CLICKHOUSE_DATABASE is not set here), and a blank endpoint or `default` list is the network's default.
#
# The sandbox is this file on a host of its own, with its own ClickHouse server and deploy/.env.sandbox (docs/deployment.md,
# "Environments"; never a testnet on the production server): the slots run XRPL Testnet and Xahau Testnet.
#   cp deploy/.env.sandbox.example deploy/.env.sandbox
#   NPM_TOKEN=... docker compose -f docker-compose.prod.yaml --env-file deploy/.env.sandbox up -d --build
#
# Run production (secrets and settings come from deploy/.env.prod - inject it from your secrets manager, never commit it; building
# needs the npm token of the private @gatehub/toolbox, passed as a BuildKit secret from the NPM_TOKEN environment variable):
#   NPM_TOKEN=... docker compose -f docker-compose.prod.yaml --env-file deploy/.env.prod up -d --build
#
# deploy/.env.prod is only read as the compose interpolation file (`--env-file`); no container gets it as a whole. Each service
# below lists the variables it needs, so a secret reaches only the services that use it (GH_API_KEYS and GH_RATE_LIMIT_KEYS: the
# apis only; the ClickHouse password: everything that talks to ClickHouse). A listed variable that is not set in the file is not
# passed on, and the app's own default applies.
#
# The images are always built from this checkout (`pull_policy: build`): the image names are not looked up in any registry.
#
# Scale the read tier of a network (compose has no rolling update; `up` recreates the changed services):
#   docker compose -f docker-compose.prod.yaml --env-file deploy/.env.prod up -d --scale api-xrpl=3 --scale api-xahau=2
#
# Exports (POST /v2/exports, ticket #15) are on when GH_EXPORT_BUCKET is set: the apis sign the download links and the
# exporters upload the files, both with a service account key mounted into them (the commented volumes below, with
# GOOGLE_APPLICATION_CREDENTIALS in the env file). The exporters run with the `exports` profile:
#   docker compose -f docker-compose.prod.yaml --env-file deploy/.env.prod --profile exports up -d --build
# Their key, EXPORTER_API_KEY, must be in GH_API_KEYS and should have a large budget in GH_RATE_LIMIT_KEYS.
#
# The syncers and the exporters are singletons: replicas 1 and a fixed container_name (compose then refuses to scale them). Keep those names:
# they are the "refuse to scale" mechanism (unlike the dev compose, which has none so it can run next to another stack). A
# single writer per network and database is a rule of the application (it holds a lease in ClickHouse), and `up` recreates a
# changed syncer by stopping the old container before starting the new one - compose has no rolling update, so the two never
# overlap. Two prod stacks on one Docker host therefore conflict on these names (and on ch-keeper / ch-server): use one host
# per stack.
#
# Backfill or repair a ledger range of one network. The live syncer keeps running; the CLI checks the syncer lease itself.
# The image holds the CLI as `dist/cli/range-ingest.js` (--help lists the options):
#   docker compose -f docker-compose.prod.yaml --env-file deploy/.env.prod run --rm --no-deps syncer-xrpl \
#     node dist/cli/range-ingest.js --from 90000000 --to 90100000
#   docker compose -f docker-compose.prod.yaml --env-file deploy/.env.prod run --rm --no-deps syncer-xahau \
#     node dist/cli/range-ingest.js --from 1 --to 100000 --concurrency 1 --chunk 100
# (wss://xahau.network throttles even one fetch at a time: one in flight; more only meets its pauses sooner. docs/backfill.md)
#
# Apply the migrations by hand (they also run on every `up`, as part of the start order; all DDL is idempotent):
#   docker compose -f docker-compose.prod.yaml --env-file deploy/.env.prod run --rm migrate-xrpl
#   docker compose -f docker-compose.prod.yaml --env-file deploy/.env.prod run --rm migrate-shared
#
# Metrics: every api, syncer and exporter serves Prometheus metrics on port 3000 (GET /metricz) of the compose network. They are
# exposed to that network only and not published; scrape them from a Prometheus container on the same network
# (targets api-xrpl:3000, syncer-xrpl:3000, exporter-xrpl:3000, ... - with scaled replicas use Docker DNS service discovery).
#
# Migrations are owned by the migrate-* jobs (the apps wait for them to complete), so the syncers run with
# GH_RUN_MIGRATIONS_ON_BOOT=false. Per slot, the compose file sets GH_NETWORK (XRPL_NETWORK / XAHAU_NETWORK in the env file), the node
# endpoints (XRPL_* / XAHAU_* in the env file), the validator lists, the start ledger and the ports.

x-syncer-build: &syncer-build
  context: .
  dockerfile: apps/syncer/Dockerfile
  secrets: [npm_token]

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  secrets: [npm_token]

x-exporter-build: &exporter-build
  context: .
  dockerfile: apps/exporter/Dockerfile
  secrets: [npm_token]

# node:slim has no wget/curl, so the probes use Node's global fetch.
x-api-healthcheck: &api-healthcheck
  test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/liveliness/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

# The syncer opens its HTTP port only once its node connection is up, and answers 503 while it is more than
# GH_MAX_LAG_HEALTHY ledgers behind for over a minute (catching up): `unhealthy` there is informational, nothing restarts on it.
x-syncer-healthcheck: &syncer-healthcheck
  test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3002/liveliness/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 60s

x-exporter-healthcheck: &exporter-healthcheck
  test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3005/liveliness/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

# The ClickHouse login is deploy/.env.prod's GH_CLICKHOUSE_USER / GH_CLICKHOUSE_PASSWORD for every client.
x-clickhouse-client: &clickhouse-client
  GH_CLICKHOUSE_URL: http://clickhouse:8123
  GH_CLICKHOUSE_USER: ${GH_CLICKHOUSE_USER:-data_api}
  GH_CLICKHOUSE_PASSWORD: ${GH_CLICKHOUSE_PASSWORD:?set a ClickHouse password}

# Optional client settings (api and syncer): passed on from deploy/.env.prod when set there (a key without a value).
x-clickhouse-tuning: &clickhouse-tuning
  GH_CLICKHOUSE_MAX_EXECUTION_TIME:
  GH_CLICKHOUSE_MAX_QUERY_MEMORY:
  GH_CLICKHOUSE_REQUEST_TIMEOUT:
  GH_CLICKHOUSE_MAX_CONNECTIONS:

x-api-env: &api-env
  <<: [*clickhouse-client, *clickhouse-tuning]
  # The apis' memory cap per query: API_CLICKHOUSE_MAX_QUERY_MEMORY (deploy/.env.prod.example sets 2 GiB), else the shared one.
  GH_CLICKHOUSE_MAX_QUERY_MEMORY: ${API_CLICKHOUSE_MAX_QUERY_MEMORY:-${GH_CLICKHOUSE_MAX_QUERY_MEMORY:-0}}
  GH_CORS_ORIGINS:
  GH_RATE_LIMIT:
  GH_RATE_LIMIT_WINDOW:
  GH_RATE_LIMIT_KEYS:
  GH_TRUST_PROXY_HOPS:
  GH_LIVE_CACHE_TTL_MS:
  GH_TX_CACHE_SIZE:
  GH_CACHE_CONTROL:
  GH_NAMES_AND_LABELS_RELOAD_MS:
  # The shared database (ADR-0014) both apis read; empty = `shared`. migrate-shared gets the same.
  GH_CLICKHOUSE_SHARED_DATABASE:
  # Exports (ticket #15): empty GH_EXPORT_BUCKET = off. The key file is mounted (see the volumes of the apis).
  GH_EXPORT_BUCKET:
  GOOGLE_APPLICATION_CREDENTIALS:
  # Export limits (ticket #16): exports per key, and the row caps the exporters share.
  GH_EXPORT_MAX_JOBS_PER_KEY:
  GH_EXPORT_MAX_ROWS_CSV:
  GH_EXPORT_MAX_ROWS_PDF:
  GH_API_KEYS: ${GH_API_KEYS:?set GH_API_KEYS - the API refuses to start in production without keys}
  GH_HTTP_API_PORT: 3001
  GH_METRICZ_PORT: 3000

x-syncer-env: &syncer-env
  <<: [*clickhouse-client, *clickhouse-tuning]
  GH_WORKERS:
  GH_LEDGER_FETCH_TIMEOUT_MS:
  GH_CATCHUP_CONCURRENCY:
  GH_CATCHUP_FLUSH_LEDGERS:
  GH_CATCHUP_FLUSH_TXS:
  GH_CATCHUP_FLUSH_MS:
  GH_MAX_LAG_HEALTHY:
  GH_UNL_THRESHOLD:
  GH_UNL_REFRESH_MS:
  GH_DOMAIN_VERIFICATION:
  GH_DOMAIN_RECHECK_MS:
  GH_DOMAIN_FETCH_TIMEOUT_MS:
  GH_RUN_MIGRATIONS_ON_BOOT: 'false' # owned by the migrate-<network> job
  GH_HTTP_API_PORT: 3002
  GH_METRICZ_PORT: 3000

x-exporter-env: &exporter-env
  <<: [*clickhouse-client, *clickhouse-tuning]
  GH_EXPORTER_API_KEY: ${EXPORTER_API_KEY:-}
  GH_EXPORT_BUCKET: ${GH_EXPORT_BUCKET:-}
  GOOGLE_APPLICATION_CREDENTIALS:
  GH_EXPORT_PAGE_SIZE:
  GH_EXPORT_POLL_MS:
  GH_EXPORT_REQUEST_TIMEOUT_MS:
  GH_EXPORT_MAX_ROWS_CSV:
  GH_EXPORT_MAX_ROWS_PDF:
  GH_HTTP_API_PORT: 3005
  GH_METRICZ_PORT: 3000

x-migrate: &migrate
  build: *syncer-build
  image: gatehub/data-syncer:${IMAGE_TAG:-latest}
  pull_policy: build
  # The schema lives in the shared package of the image: schema/ next to dist/.
  command: ['node', 'node_modules/@gatehub/data-api-shared/dist/clickhouse/migrate.js']
  depends_on:
    clickhouse:
      condition: service_healthy
  restart: 'no'

x-syncer: &syncer
  build: *syncer-build
  image: gatehub/data-syncer:${IMAGE_TAG:-latest}
  pull_policy: build
  restart: unless-stopped
  deploy:
    replicas: 1
  # The apps finish their cleanups within 10 s of SIGTERM.
  stop_grace_period: 30s
  healthcheck: *syncer-healthcheck
  # metricz (3000) and the probe (3002) are reachable inside the compose network only.
  expose: ['3000', '3002']

x-exporter: &exporter
  build: *exporter-build
  image: gatehub/data-exporter:${IMAGE_TAG:-latest}
  pull_policy: build
  profiles: ['exports']
  restart: unless-stopped
  deploy:
    replicas: 1
  # A shutdown queues the job in hand again, within 10 s of SIGTERM.
  stop_grace_period: 30s
  healthcheck: *exporter-healthcheck
  expose: ['3000', '3005']

x-api: &api
  build: *api-build
  image: gatehub/data-api:${IMAGE_TAG:-latest}
  pull_policy: build
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck: *api-healthcheck
  # no host port + no container_name -> scalable with `--scale api-<network>=N`; nginx is the only way in
  expose: ['3001', '3000']

services:
  keeper:
    image: clickhouse/clickhouse-keeper:26.8.14.3
    container_name: ch-keeper
    volumes:
      - ./deploy/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper-data:/var/lib/clickhouse-keeper
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', "echo ruok | nc -w1 127.0.0.1 9181 | grep -q imok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.14.3
    container_name: ch-server
    depends_on:
      keeper:
        condition: service_healthy
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      # No CLICKHOUSE_DB: the migrate-* jobs create the database of each network (xrpl, xahau; the sandbox's: xrpl_testnet, xahau_testnet).
      CLICKHOUSE_USER: ${GH_CLICKHOUSE_USER:-data_api}
      CLICKHOUSE_PASSWORD: ${GH_CLICKHOUSE_PASSWORD:?set a ClickHouse password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./deploy/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - clickhouse-data:/var/lib/clickhouse
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 8g }
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------------------------------------ shared

  # One-shot: create the `shared` database (account names and labels, ADR-0014) and apply its own schema, then exit 0. One job for
  # every network (two runners on one schema_migrations would race); the apis of both networks wait for it.
  migrate-shared:
    <<: *migrate
    command: ['node', 'node_modules/@gatehub/data-api-shared/dist/clickhouse/migrate.js', 'shared']
    environment:
      <<: *clickhouse-client
      GH_CLICKHOUSE_SHARED_DATABASE:

  # ------------------------------------------------------------------------------------------------ XRPL

  # The xrpl slot serves the XRPL family: XRPL_NETWORK is xrpl (the default) or xrpl-testnet (the sandbox), and nginx routes xrpl.data.*
  # to it. A Xahau name here would serve Xahau on the XRPL host. Every app of the slot logs its network at boot.

  # One-shot: create the database of the network (`xrpl`, `xrpl_testnet`) and apply the schema, then exit 0. The xrpl services wait for it.
  migrate-xrpl:
    <<: *migrate
    environment:
      <<: *clickhouse-client
      GH_NETWORK: ${XRPL_NETWORK:-xrpl}

  syncer-xrpl:
    <<: *syncer
    container_name: data-syncer-xrpl
    depends_on:
      migrate-xrpl:
        condition: service_completed_successfully
    environment:
      <<: *syncer-env
      GH_NETWORK: ${XRPL_NETWORK:-xrpl}
      # Empty = the public endpoints of the network (XRPL: wss://s2.ripple.com,wss://xrplcluster.com; XRPL Testnet: Ripple's and XRPL Labs' testnet
      # servers). Point a full-history syncer at your own node or at Ripple's full history server (wss://s2.ripple.com).
      GH_NODE_ENDPOINTS: ${XRPL_NODE_ENDPOINTS:-}
      # Empty = the node endpoints.
      GH_VALIDATION_ENDPOINTS: ${XRPL_VALIDATION_ENDPOINTS:-}
      # Empty = the validated head at the first boot; ignored once ledgers exist.
      GH_SYNC_START_LEDGER: ${XRPL_SYNC_START_LEDGER:-}
      # Empty = the config/markets/xrpl.json that ships in the image. Another file must be mounted (volumes below).
      GH_MARKETS_CONFIG: ${XRPL_MARKETS_CONFIG:-}
      # Empty = the validator list publishers of the network. An empty GH_UNL_PUBLISHERS would mean "no lists", so compose passes the word
      # `default` (the network's publishers, whatever XRPL_NETWORK is).
      GH_UNL_PUBLISHERS: ${XRPL_UNL_PUBLISHERS:-default}
      # Empty = the validator list fixed for the network, if it has one (none on the XRPL networks); `default` for the same reason.
      GH_UNL_VALIDATORS: ${XRPL_UNL_VALIDATORS:-default}
      # Empty = the config/amendments/xrpl.json that ships in the image. Another file must be mounted into the syncer and the api.
      GH_AMENDMENTS_CONFIG: ${XRPL_AMENDMENTS_CONFIG:-}
      # Balance changes from which an account is heavy and gets rollups; empty = 1000000, 0 turns the account_rollups job off.
      GH_ACCOUNT_ROLLUP_MIN_ROWS: ${XRPL_ACCOUNT_ROLLUP_MIN_ROWS:-}
    # volumes:
    #   - ./deploy/markets-xrpl.json:/etc/gatehub/markets.json:ro # and XRPL_MARKETS_CONFIG=/etc/gatehub/markets.json
    #   - ./deploy/amendments-xrpl.json:/etc/gatehub/amendments.json:ro # and XRPL_AMENDMENTS_CONFIG=/etc/gatehub/amendments.json

  api-xrpl:
    <<: *api
    depends_on:
      migrate-xrpl:
        condition: service_completed_successfully
      migrate-shared:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      GH_NETWORK: ${XRPL_NETWORK:-xrpl}
      GH_NODE_ENDPOINTS: ${XRPL_NODE_ENDPOINTS:-}
      # Empty = the config/amendments/xrpl.json that ships in the image (the same file as the syncer's).
      GH_AMENDMENTS_CONFIG: ${XRPL_AMENDMENTS_CONFIG:-}
    # volumes:
    #   - ./deploy/amendments-xrpl.json:/etc/gatehub/amendments.json:ro # and XRPL_AMENDMENTS_CONFIG=/etc/gatehub/amendments.json
    #   - ./deploy/gcs-credentials.json:/etc/gatehub/gcs.json:ro # and GOOGLE_APPLICATION_CREDENTIALS=/etc/gatehub/gcs.json

  # The exports of XRPL: exactly one exporter, which walks the lists through the api-xrpl replicas.
  exporter-xrpl:
    <<: *exporter
    container_name: data-exporter-xrpl
    depends_on:
      migrate-xrpl:
        condition: service_completed_successfully
      api-xrpl:
        condition: service_healthy
    environment:
      <<: *exporter-env
      GH_NETWORK: ${XRPL_NETWORK:-xrpl}
      GH_API_URL: http://api-xrpl:3001
    # volumes:
    #   - ./deploy/gcs-credentials.json:/etc/gatehub/gcs.json:ro # and GOOGLE_APPLICATION_CREDENTIALS=/etc/gatehub/gcs.json

  # ------------------------------------------------------------------------------------------------ Xahau

  # The xahau slot serves the Xahau family: XAHAU_NETWORK is xahau (the default) or xahau-testnet (the sandbox), and nginx routes
  # xahau.data.* to it. An XRPL name here would serve XRPL on the Xahau host. Every app of the slot logs its network at boot.

  # One-shot: create the database of the network (`xahau`, `xahau_testnet`) and apply the schema, then exit 0. The xahau services wait for it.
  migrate-xahau:
    <<: *migrate
    environment:
      <<: *clickhouse-client
      GH_NETWORK: ${XAHAU_NETWORK:-xahau}

  syncer-xahau:
    <<: *syncer
    container_name: data-syncer-xahau
    depends_on:
      migrate-xahau:
        condition: service_completed_successfully
    environment:
      <<: *syncer-env
      GH_NETWORK: ${XAHAU_NETWORK:-xahau}
      # Empty = the public endpoint of the network (Xahau: wss://xahau.network; Xahau Testnet: wss://xahau-test.net).
      GH_NODE_ENDPOINTS: ${XAHAU_NODE_ENDPOINTS:-}
      # Empty = the node endpoints.
      GH_VALIDATION_ENDPOINTS: ${XAHAU_VALIDATION_ENDPOINTS:-}
      # Empty = the validated head at the first boot; ignored once ledgers exist.
      GH_SYNC_START_LEDGER: ${XAHAU_SYNC_START_LEDGER:-}
      # Empty = the config/markets/xahau.json that ships in the image. Another file must be mounted (volumes below).
      GH_MARKETS_CONFIG: ${XAHAU_MARKETS_CONFIG:-}
      # Empty = the validator list publishers of the network (Xahau Testnet has none). An empty GH_UNL_PUBLISHERS would mean "no lists", so
      # compose passes the word `default` (the network's publishers, whatever XAHAU_NETWORK is).
      GH_UNL_PUBLISHERS: ${XAHAU_UNL_PUBLISHERS:-default}
      # Empty = the validator list fixed for the network, if it has one (Xahau Testnet: its four validators); `default` for the same reason.
      GH_UNL_VALIDATORS: ${XAHAU_UNL_VALIDATORS:-default}
      # Empty = the config/amendments/xahau.json that ships in the image. Another file must be mounted into the syncer and the api.
      GH_AMENDMENTS_CONFIG: ${XAHAU_AMENDMENTS_CONFIG:-}
      # Balance changes from which an account is heavy and gets rollups; empty = 1000000, 0 turns the account_rollups job off.
      GH_ACCOUNT_ROLLUP_MIN_ROWS: ${XAHAU_ACCOUNT_ROLLUP_MIN_ROWS:-}
    # volumes:
    #   - ./deploy/markets-xahau.json:/etc/gatehub/markets.json:ro # and XAHAU_MARKETS_CONFIG=/etc/gatehub/markets.json
    #   - ./deploy/amendments-xahau.json:/etc/gatehub/amendments.json:ro # and XAHAU_AMENDMENTS_CONFIG=/etc/gatehub/amendments.json

  api-xahau:
    <<: *api
    depends_on:
      migrate-xahau:
        condition: service_completed_successfully
      migrate-shared:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      GH_NETWORK: ${XAHAU_NETWORK:-xahau}
      GH_NODE_ENDPOINTS: ${XAHAU_NODE_ENDPOINTS:-}
      # Empty = the config/amendments/xahau.json that ships in the image (the same file as the syncer's).
      GH_AMENDMENTS_CONFIG: ${XAHAU_AMENDMENTS_CONFIG:-}
    # volumes:
    #   - ./deploy/amendments-xahau.json:/etc/gatehub/amendments.json:ro # and XAHAU_AMENDMENTS_CONFIG=/etc/gatehub/amendments.json
    #   - ./deploy/gcs-credentials.json:/etc/gatehub/gcs.json:ro # and GOOGLE_APPLICATION_CREDENTIALS=/etc/gatehub/gcs.json

  # The exports of Xahau: exactly one exporter (see exporter-xrpl).
  exporter-xahau:
    <<: *exporter
    container_name: data-exporter-xahau
    depends_on:
      migrate-xahau:
        condition: service_completed_successfully
      api-xahau:
        condition: service_healthy
    environment:
      <<: *exporter-env
      GH_NETWORK: ${XAHAU_NETWORK:-xahau}
      GH_API_URL: http://api-xahau:3001
    # volumes:
    #   - ./deploy/gcs-credentials.json:/etc/gatehub/gcs.json:ro # and GOOGLE_APPLICATION_CREDENTIALS=/etc/gatehub/gcs.json

  # ------------------------------------------------------------------------------------------------ edge

  # Routes by host name: xrpl.data.* -> api-xrpl, xahau.data.* -> api-xahau, and recovers the client address behind the front
  # proxy. TLS terminates in front of it (see the template). nginx resolves the apis per request and does not wait for them: an
  # api that is down answers 502 for its own host only. The official image renders the template at start: TRUSTED_PROXIES (the
  # front proxies, default the private ranges) -> 16-trusted-proxies.envsh -> /etc/nginx/templates/nginx.conf.template.
  # /internal/ (swagger) is blocked; /liveliness/ answers trusted proxies only.
  #
  # SECURITY - who may choose the client address: nginx believes the X-Forwarded-For / X-Forwarded-Proto of a connection that
  # comes from a TRUSTED_PROXIES address, and the rate limit keys on the address it derives. The default (all private ranges)
  # is a placeholder: set TRUSTED_PROXIES to the address(es) of your front proxy, and bind nginx (NGINX_BIND) to an interface only
  # that proxy can reach. Published on 0.0.0.0, a client that reaches the port from a private address - on Docker Desktop every
  # connection arrives from the gateway's private address - can spoof both headers and get a bucket of its own on every request.
  nginx:
    image: nginx:1.30.5-alpine
    depends_on:
      api-xrpl:
        condition: service_started
      api-xahau:
        condition: service_started
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: '^TRUSTED_PROXY_(DIRECTIVES|GEO)$'
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ./deploy/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./deploy/nginx/16-trusted-proxies.envsh:/docker-entrypoint.d/16-trusted-proxies.envsh:ro # must stay executable
    ports:
      - '${NGINX_BIND:-0.0.0.0}:${NGINX_PORT:-8080}:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 5

# The npm token for the private @gatehub/toolbox, read from the NPM_TOKEN environment variable at build time only.
secrets:
  npm_token:
    environment: NPM_TOKEN

volumes:
  keeper-data:
  clickhouse-data:
