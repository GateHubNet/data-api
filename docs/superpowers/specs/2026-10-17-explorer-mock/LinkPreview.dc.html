    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: center; gap: 18px;">
        <span style="font-size: 34px; font-weight: 600; color: #3B434E;">Payment</span>
        <span style="display: inline-flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 600; color: #17733F; background: #E3F3E9; border-radius: 999px; padding: 6px 18px;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Success</span>

      <span class="mono" style="font-size: 34px; color: #3B434E; display: flex; align-items: center; gap: 18px;">rJF2Xa…FQvg <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#7A8390" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg> rNYbL8…Kq5</span>

      <span>Ledger <span class="mono">#107,695,660</span> · 17 Oct 2026, 15:42 UTC</span>
      <span class="mono">67F91E…7C31</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","options":["#2F5BEA","#B45309","#0F766E","#111827"],"default":"#2F5BEA"},"$preview":{"width":1200,"height":630}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2F5BEA' };
  }
}
</script>
</body>
</html>
