  "/v2/accounts/{address}/analytics/counterparties":
    get:
      operationId: AccountAnalyticsController_counterparties
      summary: Get the accounts an account paid and was paid by, with what the payments
        were worth
      description: 'The payments of the account in the window, each once, by the account
        on the other side. A payment to oneself is a payment sent, its counterparty
        being the account itself. `sent_value` is what the account paid the counterparty
        and `received_value` what the counterparty paid the account: the delivered
        amounts, the native currency worth itself and an issued amount its amount
        over the rate of its day (cut to 17 significant digits per counterparty, direction,
        asset and day, and 0 without a rate); `total_value` is their sum. `payments_sent`
        and `payments_received` are the numbers of payments each way, `first` and
        `last` the times of the first and the last payment between the two in the
        window. `total` is the number of different counterparties in the window and
        `count` the number served: the first `limit` by `sort`, the largest first,
        then by the account. The window is whole UTC days, from the day of `start`
        to the day of `end` (both included, whatever the time of day), widened to
        whole buckets when there is an `interval`; the answer''s `start` is the start
        of the first day or bucket and `end` the start of the one after the last,
        so it is exclusive. An `end` before `start` is an empty answer. The route
        has no `interval`. `format=csv` gives the counterparties as a CSV file.'
      parameters:
      - name: address
        required: true
        in: path
        description: The address of the account.
        schema:
          type: string
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: limit
        required: false
        in: query
        description: How many counterparties. Default 20, at most 1000.
        schema:
          type: number
      - name: sort
        required: false
        in: query
        description: 'value (`total_value`) or count (`payments_sent + payments_received`).
          Default: value.'
        schema:
          enum:
          - value
          - count
          type: string
      - name: end
        required: false
        in: query
        description: 'The last day, whole. Default: now.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'The first day. Default: 2013-01-01.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - accounts
  "/v2/accounts/{address}/analytics/exchanges":
    get:
      operationId: AccountAnalyticsController_exchanges
      summary: Get the summary of the trades of an account on the exchange, per pair
      description: 'The trades of the account in the window (it is the buyer or the
        seller), each once, per pair in the canonical stored order. `bought` is the
        base the account received (it was the buyer) and `sold` the base it gave (it
        was the seller), `bought_counter` the counter it paid for what it bought and
        `sold_counter` the counter it received for what it sold; a trade with oneself
        is in both. `native_volume` is, for a pair with a native side, the volume
        of that side; for another, per day the base volume over the rate of the base,
        or, without one, the counter volume over the rate of the counter (cut to 17
        significant digits per day), summed; it is left out when no day of the pair
        had a rate. The pairs are sorted by `native_volume`, the largest first, the
        pairs without one last by `count`, then by the pair; `total` is the number
        of pairs in the window and `count` the number served: the first `limit`. The
        window is whole UTC days, from the day of `start` to the day of `end` (both
        included, whatever the time of day), widened to whole buckets when there is
        an `interval`; the answer''s `start` is the start of the first day or bucket
        and `end` the start of the one after the last, so it is exclusive. An `end`
        before `start` is an empty answer. The route has no `interval`. `format=csv`
        gives the pairs as a CSV file.'
      parameters:
      - name: address
        required: true
        in: path
        description: The address of the account.
        schema:
          type: string
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: limit
        required: false
        in: query
        description: How many pairs. Default 20, at most 1000.
        schema:
          type: number
      - name: end
        required: false
        in: query
        description: 'The last day, whole. Default: now.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'The first day. Default: 2013-01-01.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - accounts
  "/v2/active_accounts/{base}/{counter}":
