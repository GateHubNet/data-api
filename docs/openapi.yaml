      summary: Get statistics of the network
      description: Transactions (by type and by result), payments, exchanges, created
        accounts and ledgers per hour, day or week (Monday to Sunday, UTC), with the
        average number of transactions per ledger and the average time between ledgers.
        Without a family a row is `{date, type, result, metric}`; with `type`, `result`
        or `metric` (in the path or in `family`) it holds the values of that family
        and `date`, and `metrics` (a list) or the last part of the path picks some
        of them. What is zero is left out. A bucket is listed when it starts within
        `start` and `end`. `format=csv` gives the rows as a CSV file.
      parameters:
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 200, at most 1000.
        schema:
          type: number
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: end
        required: false
        in: query
        description: 'End time. Default: now.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: 2013-01-01.'
        schema: {}
      - name: metrics
        required: false
        in: query
        description: Comma separated names in the family; needs a family.
        schema: {}
      - name: family
        required: false
        in: query
        description: As in the path.
        schema:
          enum:
          - type
          - result
          - metric
          type: string
      - name: interval
        required: false
        in: query
        description: 'Default: day.'
        schema:
          enum:
          - hour
          - day
          - week
          type: string
      - name: metric
        required: false
        in: path
        description: A transaction type, a result code or a metric of the family.
        schema: {}
      - name: family
        required: false
        in: path
        schema:
          enum:
          - type
          - result
          - metric
          type: string
      responses:
        '200':
          description: ''
      tags:
      - stats
