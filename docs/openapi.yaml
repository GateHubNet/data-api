      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 200, at most 400.
        schema:
          type: number
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: autobridged
        required: false
        in: query
        description: Only the autobridged exchanges.
        schema:
          type: boolean
      - name: end
        required: false
        in: query
        description: 'End time. Default: the newest ledger.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: 2013-01-01.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - amm
  "/v2/amm/pools/{pool}/liquidity":
    get:
      operationId: AmmEventsController_liquidity
      summary: Get the liquidity events of a pool
      description: 'The creation, the deposits, the withdrawals, the clawbacks and
        the deletion of the pool in the ledgers that closed between `start` and `end`,
        oldest first: `{amm_account, ledger_index, tx_index, tx_hash, executed_time,
        account, initiator, event, mode?, base_amount, counter_amount, lp_tokens}`.
        The amounts are exact strings, signed from the pool side (positive into the
        pool, negative out of it); `lp_tokens` is positive when LP tokens were minted
        and negative when burned; `account` is the liquidity provider and `initiator`
        who sent the transaction (not the same for a clawback); `mode` is the mode
        of a deposit or withdrawal. `event` and `account` keep the events of that
        kind, of that provider. `format=csv` gives the events as a CSV file.'
      parameters:
      - name: pool
        required: true
        in: path
        description: The address of the pool account.
        schema:
          type: string
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Default 200, at most 1000.
        schema:
          type: number
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: account
        required: false
        in: query
        description: Only the events of this liquidity provider.
        schema: {}
      - name: event
        required: false
        in: query
        description: Only the events of this kind.
        schema:
          enum:
          - create
          - deposit
          - withdraw
          - clawback
          - delete
          type: string
      - name: end
        required: false
        in: query
        description: 'End time. Default: the newest ledger.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: the first ledger.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - amm
  "/v2/amm/pools/{pool}/governance":
    get:
      operationId: AmmEventsController_governance
      summary: Get the votes and bids of a pool
      description: 'The votes (`type` `vote`: `fee_voted`, the fee the voter asked
        for, and `trading_fee_after`, the fee of the pool after it) and the bids (`type`
        `bid`: `bid_min`, `bid_max`, `price_paid`, the LP tokens the bid burned, and
        `auction_slot`, the slot after the bid with its authorized accounts) of the
        pool in the ledgers that closed between `start` and `end`, oldest first. `type`
        keeps one kind. `format=csv` gives the rows as a CSV file, with the columns
        of both kinds.'
      parameters:
      - name: pool
        required: true
        in: path
        description: The address of the pool account.
        schema:
          type: string
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Default 200, at most 1000.
        schema:
          type: number
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: type
        required: false
        in: query
        description: Only the votes, or only the bids.
        schema:
          enum:
          - vote
          - bid
          type: string
      - name: end
        required: false
        in: query
        description: 'End time. Default: the newest ledger.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: the first ledger.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - amm
  "/v2/amm/pools/{base}/{counter}":
    get:
      operationId: AmmPairController_pair
      summary: Get the pool of a pair
      description: The live pool of the pair, in whichever order the assets are given;
        when the pair has none, the pool that was deleted last. 404 `pool not found`
        when the pair never had one.
      parameters:
      - name: base
        required: true
        in: path
        description: A currency and its issuer, `USD+rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B`,
          or the native currency alone.
        schema:
          type: string
      - name: counter
        required: true
        in: path
        description: The other side of the pair, written like `base`.
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - amm
