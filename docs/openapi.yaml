      description: 'The exchanges that were swaps against the pool, in the ledgers
        that closed between `start` and `end`, oldest first: what `GET /v2/exchanges/:base/:counter?amm=only`
        serves for the pair of the pool, restricted to the pool, with the same rows,
        the same markers and the same params (`autobridged`, the limit of at most
        400), in the pair as the pool stores it (`amm_account` is the last key of
        each). `amm` is ignored: these are always the swaps. `format=csv` gives the
        swaps as a CSV file.'
      parameters:
      - name: pool
        required: true
        in: path
        description: The address of the pool account.
