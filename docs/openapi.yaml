  "/v2/accounts/{address}/reports":
    get:
      operationId: AccountReportsController_report
      summary: Get the daily reports of an account
      description: 'A report for each UTC day from `start` to `end` (at most 200 days;
        `/{date}` is the one day), with zeros for a day without payments. It has the
        number of `Payment`s the account sent and received, the largest of each and
        their total value (`total_value` is the two totals together), and the accounts
        it paid (`receiving_counterparties`) and was paid by (`sending_counterparties`):
        their number, or the accounts with `accounts`. The values are in the native
        currency: an issued currency counts at the rate of the day (`/v2/exchange_rates`,
        in strict mode), and as 0 where it has none. `payments` lists each payment
        with its delivered amount. `format=csv` gives the reports as a CSV file. With
        `interval` (`week` from Monday, or `month`; `day` is the default) a report
        is a bucket, from the bucket of `start` to the bucket of `end` (`/{date}`
        is the one that holds the date), `date` being the start of the bucket and
        the bucket whole, up to now. The limit is 200 buckets: 200 days, 200 weeks
        or 200 months. A bucket adds up the values of its days (each at the rate of
        its day), takes the largest of their highs and adds up the payment counts;
        its counterparties are counted (or listed, in the order of their first payment
        in the bucket) over the whole bucket, so one that was paid on two days is
        one. `payments` can only be listed with `interval=day`.'
      parameters:
      - name: address
        required: true
        in: path
        description: The address of the account.
        schema:
          type: string
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: descending
        required: false
        in: query
        description: Newest day first.
        schema:
          type: boolean
      - name: payments
        required: false
        in: query
        description: List the payments of each day. Only with `interval=day`.
        schema:
          type: boolean
      - name: interval
        required: false
        in: query
        description: 'A report per day, week (from Monday) or month, UTC. Default:
          day.'
        schema:
          enum:
          - day
          - week
          - month
          type: string
      - name: accounts
        required: false
        in: query
        description: 'The counterparties themselves instead of their number. Alias:
          `counterparties`.'
        schema:
          type: boolean
      - name: end
        required: false
        in: query
        description: 'The last day, whole. Default: now.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'The first day. Default: now.'
        schema: {}
      - name: date
        required: false
        in: path
        description: 'One day: the report of the day of this date.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - accounts
