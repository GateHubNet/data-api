# OpenAPI 3.0 document of the GateHub Data API (Ripple Data API v2 compatible).
#
# GENERATED from the running app, do not edit by hand: the descriptions come from the Swagger decorators of the controllers in
# apps/api/src. Regenerate it after changing a controller (see docs/development.md, "OpenAPI"):
#
#   1. pnpm --filter @gatehub/data-api-shared build && pnpm --filter @gatehub/data-api-service build
#   2. start the API (it does not need a reachable ClickHouse to boot and serve its docs), for example
#        env -i PATH="$PATH" NODE_ENV=development GH_ENV=container GH_API_KEYS=any GH_CLICKHOUSE_URL=http://127.0.0.1:1 \
#          GH_HTTP_API_PORT=23001 GH_METRICZ_PORT=23000 node apps/api/dist/main.js
#   3. curl -s http://127.0.0.1:23001/internal/docs-json | ruby -ryaml -rjson -e 'puts JSON.parse(STDIN.read).to_yaml' > docs/openapi.yaml
#      (and put this comment back on top)
#
# Read this together with docs/api-reference.md:
#  - Every /v2/* path needs an API key: `X-API-Key: <key>` or `Authorization: Bearer <key>`. The `securitySchemes` at the end
#    of this file are the defaults of the @gatehub/toolbox bootstrap (a JWT bearer and a cookie); they do not describe this
#    API's key and no path references them.
#  - Errors are `{"result":"error","message":"..."}` (429: `{"error":"Rate limit exceeded, retry in N.NNsec"}`), see api-reference.md.
#  - The generated document lists parameters and descriptions, not response schemas: the bodies are documented in
#    api-reference.md.
#  - One deployment serves one network (XRPL or Xahau); the paths are the same on both.
---
openapi: 3.0.0
paths:
  "/liveliness/healthz":
    get:
      operationId: LivelinessController_check
      parameters: []
      responses:
        '200':
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  info:
                    type: object
                    example:
                      database:
                        status: up
                    additionalProperties:
                      type: object
                      required:
                      - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                      - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database:
                        status: up
                    additionalProperties:
                      type: object
                      required:
                      - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
        '503':
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example:
                      database:
                        status: up
                    additionalProperties:
                      type: object
                      required:
                      - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis:
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                      - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database:
                        status: up
                      redis:
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                      - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
  "/v2/ledgers":
    get:
      operationId: LedgersController_getLedger
      summary: Get a ledger
      description: A ledger by index, hash or date (the ledger that closed at or before
        it), or the latest validated ledger. `binary` wins over `expand`, and both
        win over `transactions`.
      parameters:
      - name: binary
        required: false
        in: query
        description: Include the transactions as hex.
        schema:
          type: boolean
      - name: expand
        required: false
        in: query
        description: Include the transactions as JSON.
        schema:
          type: boolean
      - name: transactions
        required: false
        in: query
        description: Include the transaction hashes.
        schema:
          type: boolean
      - name: date
        required: false
        in: query
        description: Used when there is no identifier in the path.
        schema: {}
      - name: ledger_hash
        required: false
        in: query
        description: Used when there is no identifier in the path.
        schema: {}
      - name: ledger_index
        required: false
        in: query
        description: Used when there is no identifier in the path.
        schema: {}
      - name: ledger_param
        required: false
        in: path
        description: 'Ledger index (digits), date (`YYYY-MM-DD[THH:mm:ss]`) or ledger
          hash (even-length hex). Omitted: the latest ledger.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - ledgers
  "/v2/ledgers/{ledger_param}":
    get:
      operationId: LedgersController_getLedger
      summary: Get a ledger
      description: A ledger by index, hash or date (the ledger that closed at or before
        it), or the latest validated ledger. `binary` wins over `expand`, and both
        win over `transactions`.
      parameters:
      - name: binary
        required: false
        in: query
        description: Include the transactions as hex.
        schema:
          type: boolean
      - name: expand
        required: false
        in: query
        description: Include the transactions as JSON.
        schema:
          type: boolean
      - name: transactions
        required: false
        in: query
        description: Include the transaction hashes.
        schema:
          type: boolean
      - name: date
        required: false
        in: query
        description: Used when there is no identifier in the path.
        schema: {}
      - name: ledger_hash
        required: false
        in: query
        description: Used when there is no identifier in the path.
        schema: {}
      - name: ledger_index
        required: false
        in: query
        description: Used when there is no identifier in the path.
        schema: {}
      - name: ledger_param
        required: false
        in: path
        description: 'Ledger index (digits), date (`YYYY-MM-DD[THH:mm:ss]`) or ledger
          hash (even-length hex). Omitted: the latest ledger.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - ledgers
  "/v2/last_validated":
    get:
      operationId: LastValidatedController_getLastValidated
      summary: Get the last validated ledger
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - last_validated
  "/v2/transactions/{tx_hash}":
    get:
      operationId: TransactionsController_getTransaction
      summary: Get a transaction
      description: A transaction by its hash (any case). `binary=true` gives `tx`
        and `meta` as hex.
      parameters:
      - name: tx_hash
        required: true
        in: path
        description: 'The transaction hash: an even number of hex digits.'
        schema:
          type: string
      - name: binary
        required: false
        in: query
        description: Serve `tx` and `meta` as hex.
        schema:
          type: boolean
      responses:
        '200':
          description: ''
      tags:
      - transactions
  "/v2/transactions":
    get:
      operationId: TransactionsController_list
      summary: Get transactions
      description: The transactions of the ledgers that closed between `start` and
        `end`, oldest first, each with the hash of its ledger. `type` and `result`
        are the names of the network (`Payment`, `tesSUCCESS`).
      parameters:
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 20, at most 100.
        schema:
          type: number
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: binary
        required: false
        in: query
        description: Serve `tx` and `meta` as hex.
        schema:
          type: boolean
      - name: result
        required: false
        in: query
        description: Only this transaction result code.
        schema: {}
      - name: type
        required: false
        in: query
        description: Only this transaction type.
        schema: {}
      - name: end
        required: false
        in: query
        description: 'End time. Default: the newest ledger.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: 2013-01-01.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - transactions
  "/v2/payments":
    get:
      operationId: PaymentsController_list
      summary: Get payments
      description: The `Payment` transactions between two different accounts of the
        ledgers that closed between `start` and `end`, oldest first; with a currency
        in the path, only the payments of that currency. `format=csv` gives the payments
        as a flat CSV file.
      parameters:
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 200, at most 1000.
        schema:
          type: number
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: end
        required: false
        in: query
        description: 'End time. Default: the newest ledger.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: the beginning.'
        schema: {}
      - name: currency
        required: false
        in: path
        description: 'A currency and its issuer, `USD+rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B`,
          or the native currency alone. Omitted: all currencies.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - payments
  "/v2/payments/{currency}":
    get:
      operationId: PaymentsController_list
      summary: Get payments
      description: The `Payment` transactions between two different accounts of the
        ledgers that closed between `start` and `end`, oldest first; with a currency
        in the path, only the payments of that currency. `format=csv` gives the payments
        as a flat CSV file.
      parameters:
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 200, at most 1000.
        schema:
          type: number
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: end
        required: false
        in: query
        description: 'End time. Default: the newest ledger.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: the beginning.'
        schema: {}
      - name: currency
        required: false
        in: path
        description: 'A currency and its issuer, `USD+rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B`,
          or the native currency alone. Omitted: all currencies.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - payments
  "/v2/exchanges/{base}/{counter}":
    get:
      operationId: ExchangesController_pair
      summary: Get the exchanges of a pair
      description: 'The trades between `base` and `counter` of the ledgers that closed
        between `start` and `end`, oldest first. A pair asked for in the reverse order
        of the stored one is inverted: base and counter, buyer and seller swap and
        the rate is 1/rate. With `interval`, the candles of the buckets that start
        between `start` and `end` (open, high, low, close, vwap, volumes, count);
        with `reduce=true`, one such row of the whole window. An exchange whose native
        leg is 0.0005 or less is left out of both. `format=csv` gives the rows as
        a CSV file.'
      parameters:
      - name: base
        required: true
        in: path
        description: A currency and its issuer, `USD+rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B`,
          or the native currency alone.
        schema:
          type: string
      - name: counter
        required: true
        in: path
        description: The other side of the pair, written like `base`.
        schema:
          type: string
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 200, at most 400.
        schema:
          type: number
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: autobridged
        required: false
        in: query
        description: Only the autobridged exchanges.
        schema:
          type: boolean
      - name: reduce
        required: false
        in: query
        description: One row of all the exchanges of the window. Not with `interval`.
        schema:
          type: boolean
      - name: interval
        required: false
        in: query
        description: Candles of this interval (`week` is `7day`, the ISO week) instead
          of the exchanges.
        schema:
          enum:
          - 1minute
          - 5minute
          - 15minute
          - 30minute
          - 1hour
          - 2hour
          - 4hour
          - 1day
          - 3day
          - 7day
          - 1month
          - 1year
          - week
          type: string
      - name: end
        required: false
        in: query
        description: 'End time. Default: the newest ledger.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: 2013-01-01.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - exchanges
  "/v2/exchanges":
    get:
      operationId: ExchangesController_all
      summary: Get the exchanges of every pair
      description: 'The trades of all pairs of the ledgers that closed between `start`
        and `end`, oldest first, each with the pair it is stored under. Reads every
        exchange of the range: ask for a window.'
      parameters:
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 200, at most 400.
        schema:
          type: number
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: autobridged
        required: false
        in: query
        description: Only the autobridged exchanges.
        schema:
          type: boolean
      - name: end
        required: false
        in: query
        description: 'End time. Default: the newest ledger.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: 2013-01-01.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - exchanges
  "/v2/exchange_rates/{base}/{counter}":
    get:
      operationId: ExchangeRatesController_rate
      summary: Get the exchange rate of a pair
      description: 'How many `counter` one `base` buys at `date`: the average of the
        volume weighted price of the day of `date` up to it and of the last 50 trades
        in the 14 days before it, or the latter alone when the day has none. The last
        trades count only when there are at least 10 of them, unless `strict=false`.
        With `period`, the volume weighted price of the window of that length that
        ends a second before `date`. The same asset on both sides is 1; a rate that
        cannot be told is 0. Trades whose native leg is 0.0005 or less are left out.'
      parameters:
      - name: base
        required: true
        in: path
        description: A currency and its issuer, `USD+rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B`,
          or the native currency alone.
        schema:
          type: string
      - name: counter
        required: true
        in: path
        description: The other side of the pair, written like `base`.
        schema:
          type: string
      - name: live
        required: false
        in: query
        description: 'Leave out the daily rate: only the latest trades.'
        schema:
          type: boolean
      - name: period
        required: false
        in: query
        description: The rate over a rolling window that ends a second before `date`,
          instead of the daily and the latest rate.
        schema:
          enum:
          - hour
          - day
          - 3day
          - 7day
          - 30day
          type: string
      - name: strict
        required: false
        in: query
        description: 'Default true: the last trades count only when there are at least
          10. `false` counts however many there are.'
        schema:
          type: boolean
      - name: date
        required: false
        in: query
        description: 'The moment the rate is as of, not in the future. Default: now.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - exchange_rates
  "/v2/normalize":
    get:
      operationId: NormalizeController_normalize
      summary: Convert an amount between currencies
      description: 'Converts `amount` of `currency` into `exchange_currency` at the
        rate of `date`: `rate(currency -> native) / rate(exchange_currency -> native)`,
        each the rate of `/v2/exchange_rates`. The same currency and issuer on both
        sides is rate 1; a currency without a rate gives 0.'
      parameters:
      - name: strict
        required: false
        in: query
        description: As for `/v2/exchange_rates`. Default true.
        schema:
          type: boolean
      - name: date
        required: false
        in: query
        description: 'The moment the rates are as of, not in the future. Default:
          now.'
        schema: {}
      - name: exchange_issuer
        required: false
        in: query
        description: Required for every currency but the native one.
        schema: {}
      - name: exchange_currency
        required: false
        in: query
        description: 'The currency to convert to. Default: the native currency.'
        schema: {}
      - name: issuer
        required: false
        in: query
        description: Required for every currency but the native one.
        schema: {}
      - name: currency
        required: false
        in: query
        description: 'Default: the native currency.'
        schema: {}
      - name: amount
        required: true
        in: query
        description: The amount to convert, a number.
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - normalize
  "/v2/accounts":
    get:
      operationId: AccountsController_list
      summary: Get the accounts created
      description: The accounts created in the ledgers that closed between `start`
        and `end`, oldest first, each with the account that created it (`parent`),
        the balance it was created with and when. With `parent`, only the accounts
        that address created. `format=csv` gives the accounts as a CSV file.
      parameters:
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 200, at most 1000.
        schema:
          type: number
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: parent
        required: false
        in: query
        description: Only the accounts this address created.
        schema: {}
      - name: end
        required: false
        in: query
        description: 'End time. Default: the newest ledger.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: 2013-01-01.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - accounts
  "/v2/accounts/{address}":
    get:
      operationId: AccountsController_lookup
      summary: Get an account
      description: When and by whom an account was created. An address that was created
        more than once (deleted and funded again) answers with its latest creation.
      parameters:
      - name: address
        required: true
        in: path
        description: The address of the account.
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - accounts
  "/v2/accounts/{address}/transactions/{sequence}":
    get:
      operationId: AccountTransactionsController_getBySequence
      summary: Get an account transaction by sequence
      description: The transaction the account sent with this `Sequence`. Transactions
        that use a ticket have Sequence 0; there the latest of them is returned. `binary=true`
        gives `tx` and `meta` as hex.
      parameters:
      - name: address
        required: true
        in: path
        description: The address of the account.
        schema:
          type: string
      - name: sequence
        required: true
        in: path
        description: The sequence number of the transaction (digits).
        schema:
          type: string
      - name: binary
        required: false
        in: query
        description: Serve `tx` and `meta` as hex.
        schema:
          type: boolean
      responses:
        '200':
          description: ''
      tags:
      - accounts
  "/v2/accounts/{address}/transactions":
    get:
      operationId: AccountTransactionsController_list
      summary: Get the transactions of an account
      description: Every transaction that affects the account (sent, received, or
        touching one of its offers or trust lines) in the ledgers that closed between
        `start` and `end`, oldest first. With `min_sequence` or `max_sequence` the
        list is instead the transactions the account sent, by their sequence number,
        and `start` and `end` are ignored. `type` and `result` are the names of the
        network (`Payment`, `tesSUCCESS`).
      parameters:
      - name: address
        required: true
        in: path
        description: The address of the account.
        schema:
          type: string
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 20, at most 1000.
        schema:
          type: number
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: binary
        required: false
        in: query
        description: Serve `tx` and `meta` as hex.
        schema:
          type: boolean
      - name: result
        required: false
        in: query
        description: Only this transaction result code.
        schema: {}
      - name: type
        required: false
        in: query
        description: Only this transaction type.
        schema: {}
      - name: max_sequence
        required: false
        in: query
        description: Highest sequence number, included.
        schema:
          type: number
      - name: min_sequence
        required: false
        in: query
        description: Lowest sequence number, included.
        schema:
          type: number
      - name: end
        required: false
        in: query
        description: 'End time. Default: the newest ledger.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: the first ledger.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - accounts
  "/v2/accounts/{address}/payments":
    get:
      operationId: AccountPaymentsController_list
      summary: Get the payments of an account
      description: The `Payment` transactions the account sent or received in the
        ledgers that closed between `start` and `end`, oldest first, as `GET /v2/payments`
        serves them. `type` keeps the ones it `sent` or `received`, `currency`, `issuer`,
        `source_tag` and `destination_tag` the ones with that currency, issuer or
        tag. `format=csv` gives the payments as a flat CSV file.
      parameters:
      - name: address
        required: true
        in: path
        description: The address of the account.
        schema:
          type: string
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 200, at most 1000.
        schema:
          type: number
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: destination_tag
        required: false
        in: query
        description: Only payments with this destination tag.
        schema:
          type: number
      - name: source_tag
        required: false
        in: query
        description: Only payments with this source tag.
        schema:
          type: number
      - name: issuer
        required: false
        in: query
        description: Only payments of this issuer.
        schema: {}
      - name: currency
        required: false
        in: query
        description: Only payments of this currency.
        schema: {}
      - name: type
        required: false
        in: query
        description: Only payments sent or received.
        schema:
