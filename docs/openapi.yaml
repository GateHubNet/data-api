  "/v2/network/markets":
    get:
      operationId: MarketsController_list
      summary: Get the trade statistics of every market in a live period
      description: Every pair that traded in the period (not the markets config),
        in the canonical stored order of its currencies; a price is counter per base.
        The pairs with at least `min_trades` trades are listed, by `native_volume`,
        the largest first, the pairs without one last by `count`, then by the pair;
        at most `limit`. A trade counts when its native leg is above 0.0005 (as candles).
        `open`, `high`, `low` and `last` have 8 significant digits; `change` is `(last
        / open - 1) * 100` in percent, rounded half up to 2 decimals; the volumes
        are exact. `native_volume` is the volume of the native side of a pair that
        has one; for another pair the base volume over the rate of the base, or, without
        one, the counter volume over the rate of the counter (an asset has a rate
        when it traded against the native currency in the period), cut to 17 significant
        digits; a pair without a rate has none. `sparkline` is the close of each of
        the last 7 UTC days, ending with today (a day without a trade carries the
        close before it; `close` is left out where there is none). `start_time` and
        `end_time` are the window of the set. `totals.pairs` counts the listed pairs,
        whatever the limit; `pairs_traded`, `count` and `native_volume` are over every
        pair that traded. With `exchange_currency` the answer has `exchange` and `exchange_rate`
        (units of it per native coin, at the rate of the latest trades) and a `converted_volume`
        (the native volume times the rate) on the totals and on every market that
        has a native volume. The sets are written every minute (day) or five minutes
        (7day, 30day); before the first one the answer has no markets.
      parameters:
      - name: format
        required: false
        in: query
        description: 'Default: json (csv: markets.csv).'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: limit
        required: false
        in: query
        description: Default 1000, at most 5000.
        schema:
          type: number
      - name: exchange_issuer
        required: false
        in: query
        description: Required for every currency but the native one.
        schema: {}
      - name: exchange_currency
        required: false
        in: query
        description: 'Also show the volumes in this currency. Default: the native
          currency (nothing is added).'
        schema: {}
      - name: min_trades
        required: false
        in: query
        description: 'List the pairs with at least this many trades: a whole number
          from 1 to 1000000. Default: 10.'
        schema:
          type: number
      - name: period
        required: false
        in: query
        description: 'The rolling period: the last 24 hours, 7 days or 30 days. Default:
          day.'
        schema:
          enum:
          - day
          - 7day
          - 30day
          type: string
      responses:
        '200':
          description: ''
      tags:
      - network
