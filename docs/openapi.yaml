  "/v2/amm/pools":
    get:
      operationId: AmmPoolsController_list
      summary: Get the AMM pools
      description: 'The pools in their current state, the most valuable first (`value_native`
        descending, the pools without a value last, then the account). A pool is `{amm_account,
        base_currency, base_issuer?, counter_currency, counter_issuer?, reserve_base?,
        reserve_counter?, lp_supply?, lp_currency?, trading_fee?, auction_slot?, value_native?,
        created_ledger?, created_by?, last_ledger, deleted}`: the pair in the order
        it is stored in, the amounts as exact strings, `trading_fee` in units of 1/100000,
        `value_native` (eight significant digits) the pool worth in the native currency,
        left out when no asset has a rate and for a deleted pool. `format=csv` gives
        the pools as a CSV file.'
      parameters:
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 200, at most 1000.
        schema:
          type: number
      - name: include_deleted
        required: false
        in: query
        description: Also the pools that were deleted.
        schema:
          type: boolean
      - name: asset2
        required: false
        in: query
        description: Written like `asset`; with both, the pools that have both.
        schema: {}
      - name: asset
        required: false
        in: query
        description: 'Only the pools that have this asset on either side: `USD+rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B`,
          or the native currency alone. A raw `+` (which a query string decodes as
          a space) works; `%2B` is the strict form.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - amm
  "/v2/amm/pools/{pool}/history":
    get:
      operationId: AmmPoolsController_history
      summary: Get the history of a pool
      description: 'Every state of the pool in the ledgers that closed between `start`
        and `end`, oldest first: the pool after each transaction that touched it.
        A transaction only tells the values of the pool nodes it changed, so each
        state has its missing values carried forward from the newest earlier state,
        also from before `start`. With `interval=day` instead the days of the pool
        with activity (`swap_count`, `volume_base` and `volume_counter` by side, `fees_*_est`,
        estimates, left out when a swap into the side had no known fee, liquidity
        in and out, and the closing state), a day when its start is within `start`
        and `end`. `format=csv` gives the rows as a CSV file. With `interval=day`
        the answer also has `computed_start` and `computed_end` (`YYYY-MM-DD`, after
        `result`, not in the CSV): the days of the request''s window that the daily
        figures have been computed for. `computed_end` is the newest day of the window
        that has been computed, and `computed_start` the oldest day from which every
        day up to it has been. A day inside the range without a row of the pool is
        a day it was quiet; a day outside it is not computed yet. Both are left out
        when no day of the window has been computed, and they are the same on every
        page of an answer.'
      parameters:
      - name: pool
        required: true
        in: path
        description: The address of the pool account.
        schema:
          type: string
      - name: descending
        required: false
        in: query
        description: Newest first.
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Default 200, at most 1000.
        schema:
          type: number
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: interval
        required: false
        in: query
        description: 'Without it every state; `day`: one row a day.'
        schema:
          enum:
          - day
          type: string
      - name: end
        required: false
        in: query
        description: 'End time. Default: the newest ledger.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'Start time. Default: the first ledger.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - amm
  "/v2/amm/pools/{pool}":
