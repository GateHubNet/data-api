  "/v2/accounts/{address}/stats/{family}":
    get:
      operationId: AccountStatsController_list
      summary: Get the daily stats of an account
      description: 'A row for each UTC day from `start` up to, but not including,
        `end`, in which the account was active; a day without activity has no row.
        `family=transactions`: `{date, transaction_count, result, type}`, the transactions
        the account sent that day, with how many had each result code and each transaction
        type. `family=value`: `{date, account_value, balance_change_count}`, what
        the account held at the end of the day in the native currency (the native
        balance, plus each issued currency it holds at the rate of the day, as a string;
        what the account owes is not counted) and how many times its balances changed
        that day, not counting the fee. `format=csv` gives the rows as a CSV file.
        With `interval` (`day`, `week` from Monday or `month`) the rows are buckets
        instead of days, `date` being the start of the bucket: a bucket is a row when
        its start is at or after `start` and before `end`. `transactions` has a row
        for each bucket in which the account sent a transaction, with the counts of
        the whole bucket. `value` has a row for every bucket from the first one in
        which the account had a balance to the last before `end`, active or not, but
        none that has not begun (the rows stop at the bucket that holds now, whatever
        `end` says): its value at the end of the last day of the bucket (today, for
        the current one) and the number of balance changes in it (0 for a quiet bucket).'
      parameters:
      - name: address
        required: true
        in: path
        description: The address of the account.
        schema:
          type: string
      - name: family
        required: true
        in: path
        description: 'What to count: `transactions` or `value`.'
        schema:
          enum:
          - transactions
          - value
          type: string
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: marker
        required: false
        in: query
        description: From the previous page.
        schema: {}
      - name: limit
        required: false
        in: query
        description: Default 200, at most 1000.
        schema:
          type: number
      - name: descending
        required: false
        in: query
        description: Newest day or bucket first.
        schema:
          type: boolean
      - name: interval
        required: false
        in: query
        description: 'Rows per day, week (from Monday) or month, UTC. Without it:
          a row per active day.'
        schema:
          enum:
          - day
          - week
          - month
          type: string
      - name: end
        required: false
        in: query
        description: 'Where the days stop, exclusive: `end=2015-01-16` is the days
          before it. Default: now.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'The first day, from its midnight on. Default: 2013-01-01.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - accounts
  "/v2/accounts/{address}/analytics/balances":
    get:
      operationId: AccountAnalyticsController_balances
      summary: Get the balance history of an account, per line
      description: 'A line is a currency and its counterparty (none for the native
        currency). `lines` are the lines of the account that changed up to the end
        of the window, after the filters, ranked: the native line first, then the
        lines that have a rate by their balance over that rate (the rate of the asset
        `(currency, counterparty)` on the newest valid day at or before the end of
        the window), largest first, then the others by the size of the balance; the
        first `limit` are served, and `lines_total` counts them all. `balance` of
        a line is its balance at the end of the window. `rows` are the balance of
        each of those lines at the end of each bucket: the last balance up to then,
        so a bucket without a change carries the balance before it. A line has rows
        from the bucket of its first change, or from the first bucket of the window
        when it changed before it, and a line that went back to 0 keeps its rows of
        "0". A balance below 0 is what the account owes on that line. A bucket that
        has not begun has no row, so the rows stop at the bucket that holds now whatever
        the end. The window is whole UTC days, from the day of `start` to the day
        of `end` (both included, whatever the time of day), widened to whole buckets
        when there is an `interval`; the answer''s `start` is the start of the first
        day or bucket and `end` the start of the one after the last, so it is exclusive.
        An `end` before `start` is an empty answer. At most 1000 buckets. `format=csv`
        gives the rows as a CSV file.'
      parameters:
      - name: address
        required: true
        in: path
        description: The address of the account.
        schema:
          type: string
      - name: format
        required: false
        in: query
        description: 'Default: json.'
        schema:
          enum:
          - json
          - csv
          type: string
      - name: limit
        required: false
        in: query
        description: How many lines. Default 10, at most 50.
        schema:
          type: number
      - name: counterparty
        required: false
        in: query
        description: 'Only the lines with this account; not with the native currency.
          Alias: issuer.'
        schema: {}
      - name: currency
        required: false
        in: query
        description: Only the lines of this currency (upper-cased).
        schema: {}
      - name: interval
        required: false
        in: query
        description: 'The bucket of a row: day, week (from Monday) or month, UTC.
          Default: day.'
        schema:
          enum:
          - day
          - week
          - month
          type: string
      - name: end
        required: false
        in: query
        description: 'The last day, whole. Default: now.'
        schema: {}
      - name: start
        required: false
        in: query
        description: 'The first day. Default: 2013-01-01.'
        schema: {}
      responses:
        '200':
          description: ''
      tags:
      - accounts
  "/v2/accounts/{address}/analytics/balance_changes":
    get:
      operationId: AccountAnalyticsController_balanceChanges
      summary: Get the sums of the balance changes of an account by change type and
        currency
      description: Every balance change of the window counts once, the fees (`transaction_cost`)
        too. A change type is one of transaction_cost, payment_destination, payment_source,
        exchange, intermediary, escrow_create, escrow_finish, escrow_cancel, paychannel_fund,
        paychannel_payout; the changes of transaction types that have none are grouped
        without a `change_type`. `in` is the sum of the positive changes and `out`
        the sum of the negative ones as a positive amount; `in_value` and `out_value`
        are their values in the native currency (the native currency is worth itself,
        an issued amount its amount over the rate of its day, cut to 17 significant
        digits per change type, asset and day, and 0 without a rate; a change on a
        line the account owes on is a change of its own currency), and `net_value`
        is `in_value` minus `out_value`. `totals` has an entry for each change type
        that has a change, in that order. Without `interval` `rows` are per change
        type and asset (`issuer` is left out for the native currency), the largest
        `in_value + out_value` first; with one they are per bucket and change type,
        with `date` the start of the bucket. The window is whole UTC days, from the
        day of `start` to the day of `end` (both included, whatever the time of day),
        widened to whole buckets when there is an `interval`; the answer's `start`
        is the start of the first day or bucket and `end` the start of the one after
        the last, so it is exclusive. An `end` before `start` is an empty answer.
        With an interval, at most 1000 buckets. `format=csv` gives the rows as a CSV
        file.
      parameters:
      - name: address
        required: true
        in: path
        description: The address of the account.
        schema:
          type: string
      - name: format
        required: false
